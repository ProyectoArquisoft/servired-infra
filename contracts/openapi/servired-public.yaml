  responses:
    SolicitudInvalida:
      description: Solicitud inválida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://servired.example/problemas/validacion
            title: Solicitud inválida
            status: 400
            detail: Uno o más campos no son válidos.
            errores:
              - { campo: lat, mensaje: debe estar entre -90 y 90 }
    NoAutenticado:
      description: Falta el JWT o no es válido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: about:blank, title: No autenticado, status: 401 }
    SinPermiso:
      description: El rol del JWT no permite la operación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: about:blank, title: Sin permiso, status: 403, detail: Se requiere el rol OPERADOR. }
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: about:blank, title: No encontrado, status: 404, detail: No existe el reporte 1024. }
    Conflicto:
      description: El estado actual no permite la operación (o la validación ya existe).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://servired.example/problemas/conflicto
            title: Conflicto
            status: 409
            detail: El usuario ya validó este restablecimiento.
    FueraDeRadio:
      description: El validador está fuera del radio permitido alrededor del reporte.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://servired.example/problemas/fuera-de-radio
            title: Fuera de radio
            status: 422
            detail: La validación debe hacerse a menos de 500 m del reporte.
    EvidenciaMuyGrande:
      description: La evidencia supera el tamaño máximo.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: about:blank, title: Evidencia muy grande, status: 413, detail: La foto debe pesar máximo 2 MB. }
    DemasiadasSolicitudes:
      description: Límite de tasa excedido (aplicado en el gateway).
      headers:
        Retry-After:
          description: Segundos a esperar.
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: about:blank, title: Demasiadas solicitudes, status: 429 }
    ErrorInterno:
      description: Error inesperado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example: { type: about:blank, title: Error interno, status: 500 }
